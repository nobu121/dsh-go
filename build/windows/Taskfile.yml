version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the Windows executable
    deps:
      - task: common:go:mod:tidy
      - task: common:generate:icons
    cmds:
      - task: generate:syso
        vars:
          ARCH: '{{.ARCH}}'
      - go build {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe"
      - cmd: powershell Remove-item *.syso
        platforms: [windows]
      - cmd: rm -f *.syso
        platforms: [linux, darwin]
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}-mod=mod -buildvcs=false -gcflags=all="-l"{{else}}-mod=mod -tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui -X main.Version={{.APP_VERSION}} -X main.UpdateRepo={{.UPDATE_REPO}} -X main.RuntimeBaseURL={{.RUNTIME_BASE_URL}}"{{end}}'
      APP_VERSION:
        sh: 'tr -d "[:space:]" < dsh.version 2>/dev/null || echo 0.0.0'
      UPDATE_REPO: '{{.UPDATE_REPO | default ""}}'
      RUNTIME_BASE_URL: '{{.RUNTIME_BASE_URL | default ""}}'
    env:
      GOOS: windows
      CGO_ENABLED: '{{.CGO_ENABLED | default "0"}}'
      GOARCH: '{{.ARCH | default ARCH}}'

  package:
    summary: Builds the Windows exe
    cmds:
      - task: build

  generate:syso:
    summary: Generates the Windows `.syso` resource file
    dir: build
    cmds:
      - wails3 generate syso -arch {{.ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_{{.ARCH}}.syso
    vars:
      ARCH: '{{.ARCH | default ARCH}}'

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}.exe'

  sign:
    summary: Signs the Windows executable
    deps:
      - task: build
    cmds:
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.APP_NAME}}.exe" {{if .SIGN_CERTIFICATE}}--certificate "{{.SIGN_CERTIFICATE}}"{{end}} {{if .SIGN_THUMBPRINT}}--thumbprint "{{.SIGN_THUMBPRINT}}"{{end}} {{if .TIMESTAMP_SERVER}}--timestamp "{{.TIMESTAMP_SERVER}}"{{end}}
