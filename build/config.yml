version: '3'

info:
  companyName: "nobu121"
  productName: "Deepseek Harness GO"
  productIdentifier: "com.dshgo.app"
  description: "A Wails v3 desktop shell for DeepSeek Harness"
  copyright: "© 2026, dsh-go"
  comments: "DeepSeek Harness desktop shell"
  version: "0.3.3"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - .agents
      - vendor
      - bin
    file:
      - .DS_Store
      - .gitignore
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.html"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task run
      type: primary
