version: '3'

tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    run: once
    cmds:
      - go mod tidy

  generate:icons:
    summary: Regenerates macOS `.icns` and a rounded Windows `.ico` from appicon.png
    run: once
    dir: build
    sources:
      - "appicon.png"
      - "appicon.icon"
      - "../scripts/round-windows-icon/main.go"
    generates:
      - "darwin/icons.icns"
      - "windows/icon.ico"
    cmds:
      - wails3 generate icons -input appicon.png -macfilename darwin/icons.icns -windowsfilename windows/icon.ico -iconcomposerinput appicon.icon -macassetdir darwin
      - go run -mod=mod ../scripts/round-windows-icon/main.go appicon.png windows/icon.ico
