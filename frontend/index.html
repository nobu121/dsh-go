<!doctype html>
<html lang="zh-CN" data-theme="system">
<head>
  <meta charset="utf-8" />
  <title>Deepseek Harness GO</title>
  <style>
    :root {
      --bg: #fff;
      --bar: #eee;
      --fill: #111;
      --muted: #888;
      --btn-bg: #111;
      --btn-fg: #fff;
      --logo-filter: invert(1);
    }
    html[data-theme="dark"] {
      --bg: #06070f;
      --bar: #2a2b33;
      --fill: #eee;
      --muted: #9aa0a6;
      --btn-bg: #eee;
      --btn-fg: #111;
      --logo-filter: none;
    }
    @media (prefers-color-scheme: dark) {
      html[data-theme="system"] {
        --bg: #06070f;
        --bar: #2a2b33;
        --fill: #eee;
        --muted: #9aa0a6;
        --btn-bg: #eee;
        --btn-fg: #111;
        --logo-filter: none;
      }
    }
    html[data-theme="light"] { color-scheme: light; }
    html[data-theme="dark"] { color-scheme: dark; }
    html[data-theme="system"] { color-scheme: light dark; }
    html, body { height: 100%; margin: 0; background: var(--bg); }
    main { height: 100%; display: grid; place-items: center; }
    .card { width: min(360px, calc(100vw - 48px)); text-align: center; }
    .card.wide { width: min(420px, calc(100vw - 48px)); }
    .logo {
      width: 72px;
      height: 72px;
      display: block;
      margin: 0 auto;
      filter: var(--logo-filter);
    }
    .bar {
      width: 160px; height: 3px; border-radius: 999px; background: var(--bar);
      overflow: hidden; margin: 22px auto 0;
    }
    .bar > i { display: block; height: 100%; width: 0; background: var(--fill); border-radius: inherit; }
    .bar.indeterminate > i {
      width: 36%;
      animation: bar-slide 1.1s ease-in-out infinite;
    }
    @keyframes bar-slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(400%); }
    }
    #msg, #offer-msg {
      margin: 14px auto 0; max-width: 320px; text-align: center;
      color: var(--muted); font: 13px/1.5 system-ui, sans-serif;
    }
    h1 {
      margin: 22px 0 0;
      color: var(--fill);
      font: 600 20px/1.3 system-ui, sans-serif;
    }
    .actions {
      display: flex; justify-content: center; gap: 10px; margin-top: 22px;
    }
    button {
      margin-top: 22px; border: 0; border-radius: 8px; padding: 8px 16px;
      background: var(--btn-bg); color: var(--btn-fg); font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .actions button { margin-top: 0; min-width: 108px; }
    button.secondary {
      background: transparent;
      color: var(--fill);
      box-shadow: inset 0 0 0 1px var(--bar);
    }
    #ver {
      margin: 18px 0 0;
      color: var(--muted);
      font: 12px/1.4 system-ui, sans-serif;
      opacity: 0.75;
    }
    #items {
      list-style: none; margin: 18px 0 0; padding: 0;
      border: 1px solid var(--bar); border-radius: 10px; overflow: hidden;
      text-align: left;
    }
    .card.wide #items {
      max-height: min(40vh, 280px);
      overflow-x: hidden;
      overflow-y: auto;
    }
    #items li {
      display: grid; grid-template-columns: 1fr auto; gap: 12px;
      align-items: center; padding: 10px 12px;
    }
    #items li.plugin {
      grid-template-columns: auto 1fr auto;
    }
    #items li.plugin label {
      display: contents;
      cursor: pointer;
    }
    #items input[type="checkbox"] {
      margin: 0;
      accent-color: var(--fill);
    }
    #items li + li { border-top: 1px solid var(--bar); }
    #items .item-name { color: var(--fill); font: 600 13px/1.3 system-ui, sans-serif; overflow-wrap: anywhere; }
    #items .item-ver {
      color: var(--muted); font: 12px/1.3 system-ui, sans-serif;
      max-width: 9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    button.text {
      margin-top: 14px;
      background: transparent;
      color: var(--muted);
      font-weight: 500;
      padding: 4px 8px;
    }
    #error-detail {
      margin: 12px 0 0;
      max-height: min(28vh, 200px);
      overflow: auto;
      text-align: left;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: var(--fill);
      background: transparent;
      border: 1px solid var(--bar);
      border-radius: 10px;
      padding: 10px 12px;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    button[hidden], .bar[hidden], #msg[hidden], #status[hidden], #offer[hidden], #items[hidden], #ver[hidden], #view-error[hidden], #error-detail[hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <img class="logo" src="/build/appicon.png" alt="" />
      <div id="status">
        <div class="bar indeterminate" id="bar"><i id="fill"></i></div>
        <p id="msg">Deepseek Harness GO</p>
        <button id="retry" type="button" hidden>↻</button>
      </div>
      <div id="offer" hidden>
        <h1 id="offer-title">发现新版本</h1>
        <p id="offer-msg"></p>
        <ul id="items" hidden></ul>
        <button id="view-error" type="button" class="text" hidden>查看报错</button>
        <pre id="error-detail" hidden></pre>
        <div class="actions">
          <button id="apply" type="button">立即更新</button>
          <button id="later" type="button" class="secondary">稍后</button>
        </div>
        <p id="ver"></p>
      </div>
    </div>
  </main>
  <script type="module">
    import { Events } from "/wails/runtime.js";

    const COPY = {
      zh: {
        init: "正在初始化",
        offerTitle: "发现新版本",
        recoverTitle: "无法启动",
        recoverFail: "Harness 插件加载失败",
        apply: "立即更新",
        later: "稍后",
        disableRestart: "禁用并重启",
        restartOnly: "仅重启",
        viewError: "查看报错",
        hideError: "收起报错",
        download: "正在下载",
        unpack: "正在安装",
      },
      en: {
        init: "Starting",
        offerTitle: "Update available",
        recoverTitle: "Could not start",
        recoverFail: "Harness failed to load plugins",
        apply: "Update now",
        later: "Later",
        disableRestart: "Disable and restart",
        restartOnly: "Restart only",
        viewError: "View error",
        hideError: "Hide error",
        download: "Downloading",
        unpack: "Installing",
      },
    };

    const status = document.getElementById("status");
    const offer = document.getElementById("offer");
    const bar = document.getElementById("bar");
    const fill = document.getElementById("fill");
    const msg = document.getElementById("msg");
    const retry = document.getElementById("retry");
    const offerTitle = document.getElementById("offer-title");
    const offerMsg = document.getElementById("offer-msg");
    const itemsEl = document.getElementById("items");
    const applyBtn = document.getElementById("apply");
    const later = document.getElementById("later");
    const ver = document.getElementById("ver");
    const viewError = document.getElementById("view-error");
    const errorDetail = document.getElementById("error-detail");
    let recoverMode = false;

    function viewErrorLabel(open) {
      const c = copy();
      return open ? c.hideError : c.viewError;
    }

    function copy() {
      return COPY[document.documentElement.lang === "en" ? "en" : "zh"];
    }

    function setLocale(pref) {
      const en = pref === "en";
      document.documentElement.lang = en ? "en" : "zh-CN";
      const c = copy();
      if (recoverMode) {
        offerTitle.textContent = c.recoverTitle;
        offerMsg.textContent = c.recoverFail;
        later.textContent = c.restartOnly;
        if (applyBtn.dataset.locked) applyBtn.textContent = c.disableRestart;
        viewError.textContent = viewErrorLabel(!errorDetail.hidden);
      } else {
        offerTitle.textContent = c.offerTitle;
        later.textContent = c.later;
        if (!applyBtn.dataset.locked) applyBtn.textContent = c.apply;
      }
    }

    function renderItems(items, selectable) {
      itemsEl.replaceChildren();
      if (selectable) {
        items = [...items].sort((a, b) => Number(Boolean(b.Selected ?? b.selected)) - Number(Boolean(a.Selected ?? a.selected)));
      }
      for (const it of items) {
        const li = document.createElement("li");
        const name = document.createElement("span");
        name.className = "item-name";
        const pkg = it.Name ?? it.name ?? "";
        name.textContent = pkg;
        const itemVer = document.createElement("span");
        itemVer.className = "item-ver";
        const version = it.Version ?? it.version ?? "";
        itemVer.textContent = version ? "Version " + version : "";
        if (selectable) {
          li.className = "plugin";
          const box = document.createElement("input");
          box.type = "checkbox";
          box.value = pkg;
          box.checked = Boolean(it.Selected ?? it.selected);
          const label = document.createElement("label");
          label.append(box, name, itemVer);
          li.append(label);
        } else {
          li.append(name, itemVer);
        }
        itemsEl.append(li);
      }
    }

    function selectedPluginNames() {
      return [...itemsEl.querySelectorAll("input[type=checkbox]:checked")]
        .map((el) => el.value)
        .filter(Boolean);
    }

    function setTheme(pref) {
      const lock = pref === "dark" || pref === "light" ? pref : "system";
      document.documentElement.dataset.theme = lock;
    }

    function apply(p) {
      const stage = p.Stage ?? p.stage ?? "";
      const bytes = Number(p.Bytes ?? p.bytes ?? 0);
      const total = Number(p.Total ?? p.total ?? 0);
      const text = p.Message ?? p.message ?? "";
      const c = copy();
      const action = p.Action ?? p.action ?? c.apply;
      const version = p.Version ?? p.version ?? "";
      const err = stage === "error";
      const isOffer = stage === "offer";
      const isRecover = stage === "recover";
      recoverMode = isRecover;
      const labels = { download: c.download, unpack: c.unpack };
      const hasProgress = Boolean(labels[stage]) && total > 0;
      const card = document.querySelector(".card");
      if (card) card.classList.toggle("wide", isRecover);

      offer.hidden = !isOffer && !isRecover;
      status.hidden = isOffer || isRecover;
      retry.hidden = !err;
      if (isRecover) {
        const items = p.Items ?? p.items ?? [];
        offerTitle.textContent = c.recoverTitle;
        offerMsg.textContent = text || c.recoverFail;
        offerMsg.hidden = false;
        applyBtn.textContent = action || c.disableRestart;
        applyBtn.dataset.locked = "1";
        applyBtn.hidden = items.length === 0;
        later.textContent = c.restartOnly;
        itemsEl.hidden = items.length === 0;
        if (items.length) renderItems(items, true);
        const detail = (p.Detail ?? p.detail ?? "").trim();
        errorDetail.textContent = detail;
        errorDetail.hidden = true;
        viewError.hidden = !detail;
        viewError.textContent = c.viewError;
        ver.hidden = true;
        ver.textContent = "";
        return;
      }
      viewError.hidden = true;
      errorDetail.hidden = true;
      errorDetail.textContent = "";
      if (isOffer) {
        const items = p.Items ?? p.items ?? [];
        const many = items.length > 1;
        offerTitle.textContent = c.offerTitle;
        later.textContent = c.later;
        offerMsg.textContent = text;
        offerMsg.hidden = !text;
        applyBtn.textContent = action;
        applyBtn.dataset.locked = "1";
        applyBtn.hidden = false;
        itemsEl.hidden = !many;
        if (many) renderItems(items, false);
        ver.hidden = many || !version;
        ver.textContent = !many && version ? "Version " + version : "";
        return;
      }
      if (err) {
        bar.hidden = true;
        bar.classList.remove("indeterminate");
        msg.hidden = !text;
        msg.textContent = text;
        return;
      }
      bar.hidden = false;
      if (hasProgress) {
        const pct = Math.min(100, Math.round(bytes / total * 100));
        bar.classList.remove("indeterminate");
        fill.style.width = pct + "%";
        msg.hidden = false;
        msg.textContent = labels[stage] + " " + pct + "%";
        return;
      }
      bar.classList.add("indeterminate");
      fill.style.width = "";
      msg.hidden = false;
      msg.textContent = text || c.init;
    }

    const urlLang = new URLSearchParams(location.search).get("lang");
    if (urlLang === "en" || urlLang === "zh") setLocale(urlLang);

    Events.On("dsh-go:theme-pref", (e) => setTheme(e?.data ?? e ?? "system"));
    Events.On("dsh-go:locale", (e) => setLocale(e?.data ?? e ?? "zh"));
    Events.On("dsh-go:prep", (e) => apply(e?.data ?? e ?? {}));
    retry.addEventListener("click", () => {
      retry.hidden = true;
      apply({});
      Events.Emit("dsh-go:prep-retry");
    });
    applyBtn.addEventListener("click", () => {
      if (recoverMode) {
        Events.Emit("dsh-go:prep-apply", selectedPluginNames().join("\n"));
        return;
      }
      Events.Emit("dsh-go:prep-apply");
    });
    later.addEventListener("click", () => Events.Emit("dsh-go:prep-later"));
    viewError.addEventListener("click", () => {
      const open = errorDetail.hidden;
      errorDetail.hidden = !open;
      viewError.textContent = viewErrorLabel(open);
    });
    Events.Emit("dsh-go:prep-ready");
  </script>
</body>
</html>
