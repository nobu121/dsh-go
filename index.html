<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>dsh-go</title>
  <style>
    html, body { height: 100%; margin: 0; background: #fff; }
    main { height: 100%; display: grid; place-items: center; }
    .logo {
      width: 72px;
      height: 72px;
      display: block;
      margin: 0 auto;
      filter: invert(1);
    }
    .bar {
      width: 160px; height: 3px; border-radius: 999px; background: #eee;
      overflow: hidden; margin: 22px auto 0;
    }
    .bar > i { display: block; height: 100%; width: 0; background: #111; border-radius: inherit; }
    .bar.indeterminate > i {
      width: 36%;
      animation: bar-slide 1.1s ease-in-out infinite;
    }
    @keyframes bar-slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(400%); }
    }
    button {
      margin-top: 22px; border: 0; border-radius: 8px; padding: 8px 16px;
      background: #111; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    button[hidden], .bar[hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <div>
      <img class="logo" src="/build/appicon.png" alt="" />
      <div class="bar" id="bar" hidden><i id="fill"></i></div>
      <button id="retry" type="button" hidden>↻</button>
    </div>
  </main>
  <script>
    const bar = document.getElementById("bar");
    const fill = document.getElementById("fill");
    const retry = document.getElementById("retry");

    window.wails?.Events?.On?.("dsh-go:prep", (e) => {
      const p = e?.data ?? e ?? {};
      const stage = p.Stage ?? p.stage ?? "";
      const bytes = Number(p.Bytes ?? p.bytes ?? 0);
      const total = Number(p.Total ?? p.total ?? 0);
      retry.hidden = stage !== "error";
      if (stage === "download") {
        bar.hidden = false;
        if (total > 0) {
          bar.classList.remove("indeterminate");
          fill.style.width = Math.min(100, Math.round(bytes / total * 100)) + "%";
        } else {
          bar.classList.add("indeterminate");
          fill.style.width = "";
        }
      } else {
        bar.hidden = true;
        bar.classList.remove("indeterminate");
      }
    });

    retry.addEventListener("click", () => {
      retry.hidden = true;
      window.wails?.Events?.Emit?.("dsh-go:prep-retry");
    });
    window.wails?.Events?.Emit?.("dsh-go:prep-ready");
  </script>
</body>
</html>
