<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>dsh-go</title>
  <style>
    html, body { height: 100%; margin: 0; background: #06070f; color: #dbe2f5;
      font-family: ui-sans-serif, system-ui, sans-serif; }
    main { height: 100%; display: grid; place-items: center; }
    p { font-size: 15px; opacity: .8; }
    .dot::after { content: ''; animation: dots 1.2s steps(4, end) infinite; }
    @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
  </style>
</head>
<body>
  <main>
    <p><span class="dot">正在启动 DeepSeek Harness</span></p>
  </main>
</body>
</html>
