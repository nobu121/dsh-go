<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    button {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 999px;
      background: #1d4ed8;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      padding: 0 14px;
      white-space: nowrap;
    }
    button:hover { background: #1e40af; }
    button:active { background: #1e3a8a; }
  </style>
</head>
<body>
  <button id="pill" type="button">更新到</button>
  <script>
    const pill = document.getElementById("pill");
    window.wails?.Events?.On?.("dsh-go:capsule-label", (e) => {
      const label = e?.data ?? e;
      if (typeof label === "string" && label) pill.textContent = label;
    });
    pill.addEventListener("click", () => {
      window.wails?.Events?.Emit?.("dsh-go:apply-update");
    });
    window.wails?.Events?.Emit?.("dsh-go:capsule-ready");
  </script>
</body>
</html>
