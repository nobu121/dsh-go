name: Release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      CNB_TOKEN:
        required: false
      MACOS_CERTIFICATE_P12:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false
      MACOS_SIGN_IDENTITY:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: dsh / product version (empty = dsh.version)
        required: false
        type: string

permissions:
  contents: write

env:
  UPDATE_REPO: ${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: darwin-arm64
            path: |
              bin/dsh-go-darwin-arm64.dmg
              bin/dsh-runtime-darwin-arm64.zip
          - os: windows-latest
            artifact: windows-amd64
            path: |
              bin/dsh-go-windows-amd64.exe
              bin/dsh-runtime-windows-amd64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Pin version
        shell: bash
        run: |
          ver="${{ inputs.version }}"
          if [ -z "$ver" ]; then
            ver="$(tr -d '[:space:]' < dsh.version)"
          fi
          printf '%s\n' "$ver" > dsh.version
          echo "APP_VERSION=$ver" >> "$GITHUB_ENV"
          echo "RUNTIME_BASE_URL=https://cnb.cool/nobu121/dsh-go/-/releases/download/v${ver}" >> "$GITHUB_ENV"
      - name: Sync dsh runtime
        shell: bash
        run: bash scripts/sync-dsh.sh
      - name: Smoke dsh runtime
        shell: bash
        run: bash scripts/smoke-dsh.sh
      - name: Install wails3
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16
      - name: Install UPX
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install upx -y --no-progress
      - name: Package dist
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: wails3 task package:dist APP_VERSION="$APP_VERSION" UPDATE_REPO="$UPDATE_REPO" RUNTIME_BASE_URL="$RUNTIME_BASE_URL"
      - name: Package runtime
        shell: bash
        run: wails3 task package:runtime
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          shopt -s nullglob
          sha256sum dsh-go-*.dmg dsh-go-*.exe dsh-runtime-*.zip > SHA256SUMS
          cat SHA256SUMS
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          ver="$VERSION"
          if [ -z "$ver" ]; then
            ver="$(tr -d '[:space:]' < dsh.version)"
          fi
          tag="v${ver}"
          notes="Shell-only dsh-go ${ver}: macOS DMG, Windows exe, plus on-demand dsh-runtime zips."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete-asset "$tag" dsh-go-darwin-arm64.zip --yes || true
            gh release delete-asset "$tag" dsh-go-windows-amd64.zip --yes || true
            gh release upload "$tag" dist/dsh-go-* dist/dsh-runtime-* dist/SHA256SUMS --clobber
          else
            gh release create "$tag" dist/dsh-go-* dist/dsh-runtime-* dist/SHA256SUMS \
              --title "$tag" \
              --notes "$notes" \
              --prerelease
          fi
      - name: Sync release to CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: nobu121/dsh-go
          VERSION: ${{ inputs.version }}
        run: |
          ver="$VERSION"
          if [ -z "$ver" ]; then
            ver="$(tr -d '[:space:]' < dsh.version)"
          fi
          bash scripts/sync-release-to-cnb.sh "v${ver}" dist
      - name: Commit dsh.version
        if: inputs.version != ''
        run: |
          ver="${{ inputs.version }}"
          printf '%s\n' "$ver" > dsh.version
          git add dsh.version
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bump bundled dsh to ${ver}"
          git push
