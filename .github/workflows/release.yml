name: Release client

# Ships the desktop client only. The dsh runtime rides the separate
# runtime-latest channel (release-runtime.yml), so an upstream dsh bump needs
# no client build, no notarization and no forced update for users.

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
    secrets:
      CNB_TOKEN:
        required: false
      MACOS_CERTIFICATE_P12:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false
      MACOS_SIGN_IDENTITY:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: client version (empty = app.version)
        required: false
        type: string

permissions:
  contents: write

env:
  UPDATE_REPO: ${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: darwin-arm64
            path: bin/dsh-go-darwin-arm64.dmg
          - os: windows-latest
            artifact: windows-amd64
            path: bin/dsh-go-windows-amd64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Resolve client version
        shell: bash
        run: |
          ver="${{ inputs.version }}"
          if [ -z "$ver" ]; then
            ver="$(tr -d '[:space:]' < app.version)"
          fi
          printf '%s\n' "$ver" > app.version
          bash scripts/sync-app-version.sh "$ver"
          echo "APP_VERSION=$ver" >> "$GITHUB_ENV"
          echo "RUNTIME_BASE_URL=https://cnb.cool/nobu121/dsh-go/-/releases/download/runtime-latest" >> "$GITHUB_ENV"
      - name: Install wails3
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16
      - name: Package dist
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: wails3 task package:dist APP_VERSION="$APP_VERSION" UPDATE_REPO="$UPDATE_REPO" RUNTIME_BASE_URL="$RUNTIME_BASE_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          shopt -s nullglob
          sha256sum dsh-go-*.dmg dsh-go-*.zip > SHA256SUMS
          cat SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          ver="$VERSION"
          if [ -z "$ver" ]; then
            ver="$(tr -d '[:space:]' < app.version)"
          fi
          tag="v${ver}"
          notes="dsh-go client ${ver}: macOS DMG and Windows zip. The dsh runtime updates on its own from the runtime-latest channel."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --prerelease=false --latest --notes "$notes"
            gh release upload "$tag" dist/dsh-go-* dist/SHA256SUMS --clobber
          else
            gh release create "$tag" dist/dsh-go-* dist/SHA256SUMS \
              --title "$tag" \
              --notes "$notes" \
              --latest
          fi
      - name: Sync release to CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: nobu121/dsh-go
          CNB_PRERELEASE: "false"
          CNB_MAKE_LATEST: "true"
          VERSION: ${{ inputs.version }}
        run: |
          ver="$VERSION"
          if [ -z "$ver" ]; then
            ver="$(tr -d '[:space:]' < app.version)"
          fi
          export CNB_NOTES="dsh-go client ${ver}"
          bash scripts/sync-release-to-cnb.sh "v${ver}" dist
      - name: Commit app.version
        if: inputs.version != ''
        run: |
          ver="${{ inputs.version }}"
          printf '%s\n' "$ver" > app.version
          bash scripts/sync-app-version.sh "$ver"
          git add app.version build/config.yml build/windows/info.json build/darwin/Info.plist
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release client ${ver}"
          git push
