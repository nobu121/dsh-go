version: '3'

vars:
  APP_NAME: "dsh-go"
  BIN_DIR: "bin"
  UPDATE_REPO: '{{.UPDATE_REPO | default ""}}'
  RUNTIME_BASE_URL: '{{.RUNTIME_BASE_URL | default ""}}'
  APP_VERSION: '{{.APP_VERSION | default ""}}'
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml

tasks:
  build:
    summary: Builds the application for the host OS
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build for the host OS
    cmds:
      - task: "{{.GOOS}}:package"

  package:dist:
    summary: Packages macOS DMG or Windows zip
    cmds:
      - task: '{{if eq OS "darwin"}}package{{else}}build{{end}}'
        vars:
          UPDATE_REPO: '{{.UPDATE_REPO}}'
          RUNTIME_BASE_URL: '{{.RUNTIME_BASE_URL}}'
          APP_VERSION: '{{.APP_VERSION}}'
      - bash ./scripts/package-dist.sh

  package:runtime:
    summary: Packages on-demand dsh-runtime zip from vendor/dsh
    cmds:
      - bash ./scripts/package-runtime.sh

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Builds with DEV=true and runs
    cmds:
      - task: build
        vars:
          DEV: "true"
      - task: run
